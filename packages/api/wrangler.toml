name = "forge-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"

# D1 binding — run `npm run db:create` once and paste the database_id below.
[[d1_databases]]
binding = "DB"
database_name = "forge-bible"
database_id = "3e3e409e-929d-4dfe-8c23-421a57179501"
migrations_dir = "migrations"

[vars]
DEFAULT_TRANSLATION = "KJV"
LOG_LEVEL = "info"

# ANTHROPIC_API_KEY is set as a secret:  wrangler secret put ANTHROPIC_API_KEY

# Per-domain deploys for the multi-database router (Phase 4 of the spec).
[env.bible]
name = "forge-api-bible"

[env.openintel]
name = "forge-api-openintel"
